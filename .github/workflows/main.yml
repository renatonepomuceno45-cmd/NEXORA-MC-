
name: Compilar NEXORA SOULS

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar plugin
        run: mvn --batch-mode clean package

      - name: Gerar arquivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-SOULS-JAR
          path: target/*.jar
          
